    <script>
      // Resolve the theme before first paint so the loading screen matches
      // the user's saved/system preference instead of always flashing dark.
      (function () {
        try {
          var saved = localStorage.getItem('fuel-finder-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : prefersDark
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      #app-loader {
        position: fixed;

        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b0f1a;
        transition: opacity 0.25s ease;
      }
      html[data-theme="light"] #app-loader {
        background: #f4f9ff;
      }
      #app-loader .app-loader-icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
      }
      #app-loader .app-loader-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(56, 189, 248, 0.25);
        border-top-color: #38bdf8;
        animation: app-loader-spin 0.8s linear infinite;
      }
      #app-loader.app-loader-hidden {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script>
      // Hide the loading screen as soon as Angular renders real content
      // inside <app-root>, then remove it from the DOM after the fade-out.
      (function () {
        var loader = document.getElementById("app-loader");
        var appRoot = document.querySelector("app-root");
        if (!loader || !appRoot) return;

        function hideLoader() {
          loader.classList.add("app-loader-hidden");
          setTimeout(function () {
            loader.remove();
          }, 300);
        }

        var observer = new MutationObserver(function () {
          if (appRoot.childNodes.length > 0) {
            observer.disconnect();
            hideLoader();
          }
        });
        observer.observe(appRoot, { childList: true });

        // Fallback in case Angular fails to bootstrap in time or the
        // MutationObserver never fires (e.g. very old browsers).
        setTimeout(hideLoader, 8000);
      })();
    </script>
