<!doctype html>
<html>
  <head>
    <title>Fuel Finder</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fuel Finder" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial;
      }
      #map {
        width: 100%;
        height: 50vh;
      }
      #controls {
        padding: 10px;
      }
      #stations {
        padding: 10px;
      }
      .station {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .open {
        border-color: green;
      }
      .closed {
        border-color: red;
      }
      .cheapest {
        border: 2px solid #f59e0b;
        background: #fffbeb;
      }
      .cheapest-badge {
        background: #f59e0b;
        color: #7c2d00;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 4px;
        display: inline-block;
        margin-bottom: 6px;
      }
      .highlight {
        font-weight: bold;
        color: #b45309;
      }
    </style>
  </head>
  <body>
    <div id="controls"></div>
    <div id="stations"></div>
    <div id="map"></div>
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
    <script src="./sw.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js");
      }
    </script>
  </body>
</html>
